# Netlify Configuration for Situation-Based Language Learning
# Deploy both frontend-cms and frontend-cram as separate Netlify sites
# Configure each site in the Netlify dashboard

[build.environment]
  NODE_VERSION = "20"

# SPA redirect for client-side routing
# This is a fallback if _redirects files aren't working
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
