services:
  - type: web
    name: sbll-backend
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: src/backend
    dockerfilePath: ./Dockerfile
    dockerContext: ../..
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    preDeployCommand: npx prisma migrate deploy --schema prisma/schema.prisma

databases:
  - name: sbll-db
    databaseName: sbll
    user: sbll_user
    plan: basic-256mb
    region: frankfurt
